# docker-compose.override.yml — automatically applied on top of docker-compose.yml
# during local development (docker compose up).
# Switches both services to the `dev` Dockerfile target for hot-reload.

version: "3.8"

services:
  backend:
    build:
      target: dev
    environment:
      NODE_ENV: development
      # Override to force postgres dialect even in dev
      DB_DIALECT: postgres
    # Bind-mount source so ts-node-dev picks up changes without rebuilding
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    # No restart in dev — let it crash visibly
    restart: "no"

  admin-dashboard:
    build:
      target: dev
    environment:
      HOST: "0.0.0.0"
      WATCHPACK_POLLING: "true"
      # Keep API URL pointing at the backend container
      REACT_APP_API_URL: http://localhost:3000/api/v1
    # Bind-mount source for hot-reload
    volumes:
      - ./admin-dashboard:/app
      - admin_node_modules:/app/node_modules
    restart: "no"

volumes:
  backend_node_modules:
  admin_node_modules:
